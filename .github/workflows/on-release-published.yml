name: Publish SDK NuGet
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: '*'
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # Use the NuGet username that created the trusted publishing policy.
          user: pct-magnusopera
      - name: Publish package and symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY"
          shopt -s nullglob
          packages=(./*.nupkg)
          test "${#packages[@]}" -eq 1
          dotnet nuget push "${packages[0]}" --skip-duplicate --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
